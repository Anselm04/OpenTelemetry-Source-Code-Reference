name: Rerun exact Git-tree audit with force-staged reports
on:
  push:
    paths:
      - '.github/workflows/audit-source-once.yml'
permissions:
  contents: write
jobs:
  audit:
    uses: Anselm04/Macro-source-code-reference-/.github/workflows/reusable-source-audit.yml@main
    with:
      upstream_url: https://github.com/open-telemetry/opentelemetry-js.git
      upstream_sha: 5a78e6aef1fcbbe8306d982c0b3f0f1ea57eb032
      audit_slug: opentelemetry
